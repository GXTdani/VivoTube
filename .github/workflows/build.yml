name: Build VPK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install curl with mbedTLS (as the author does)
        run: |
          export PATH="$VITASDK/bin:$PATH"
          yes | vdpm curl-mbedtls mbedtls zlib zstd bzip2 libvita2d freetype libpng libjpeg-turbo harfbuzz fribidi
      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: VivoTube-vpk
          path: build/VivoTube.vpk
